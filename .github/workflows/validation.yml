name: Technical validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    # Static Prisma checks only need a syntactically valid URL; never expose
    # production database credentials to pull-request code.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sap_core_static?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:tenant-context
      - run: pnpm test:tenant-target-context
      - run: pnpm test:authorization-policy
      - run: pnpm test:organization-members-reader
      - run: pnpm test:v04-transaction-boundary

  v03-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: sap_core
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sap_core_v03_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U sap_core -d sap_core_v03_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_USER: sap_core
      CI_DATABASE_HOST: 127.0.0.1
      CI_DATABASE_PORT: "55432"
      CI_DATABASE_NAME: sap_core_v03_test
      V03_ALLOW_DISPOSABLE_DB: "1"
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Configure disposable test credentials
        run: |
          set -euo pipefail
          echo "DATABASE_URL=postgresql://${CI_DATABASE_USER}@${CI_DATABASE_HOST}:${CI_DATABASE_PORT}/${CI_DATABASE_NAME}?schema=public" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:status
      - name: Start Next.js development server
        run: |
          log_file="$(mktemp "${RUNNER_TEMP}/sap-core-next.XXXXXX.log")"
          pnpm dev >"$log_file" 2>&1 &
          server_pid=$!
          {
            echo "NEXT_SERVER_LOG=$log_file"
            echo "NEXT_SERVER_PID=$server_pid"
          } >> "$GITHUB_ENV"
      - name: Wait for Better Auth readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))

          while (( SECONDS < deadline )); do
            if curl --fail --silent http://127.0.0.1:3000/api/auth/get-session >/dev/null; then
              echo "Better Auth endpoint is ready."
              exit 0
            fi

            if ! kill -0 "$NEXT_SERVER_PID" 2>/dev/null; then
              echo "Next.js server exited before becoming ready. Server log:" >&2
              cat "$NEXT_SERVER_LOG" >&2
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Better Auth. Server log:" >&2
          cat "$NEXT_SERVER_LOG" >&2
          exit 1
      - run: pnpm test:v03

  v04-pinned-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: sap_core
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sap_core_d7_test
        ports:
          - "55435:5432"
          - "55434:5432"
        options: >-
          --health-cmd "pg_isready -U sap_core -d sap_core_d7_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_USER: sap_core
      CI_DATABASE_HOST: 127.0.0.1
      CI_DATABASE_PORT: "55435"
      CI_DATABASE_NAME: sap_core_d7_test
      D7_ALLOW_DISPOSABLE_DB: "1"
      V04_ALLOW_DISPOSABLE_DB: "1"
      D8_ALLOW_DISPOSABLE_DB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Configure disposable DATABASE_URL
        run: echo "DATABASE_URL=postgresql://${CI_DATABASE_USER}@${CI_DATABASE_HOST}:${CI_DATABASE_PORT}/${CI_DATABASE_NAME}?schema=public" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - name: Recover pinned migrations 1–8
        run: |
          set -euo pipefail
          baseline="d27af783d3e9499a451331f720ec111e6b5e7049"
          git fetch --no-tags origin "$baseline"
          git cat-file -e "${baseline}^{commit}"
          mkdir -p "$RUNNER_TEMP/v04-pinned"
          git archive --format=tar "$baseline" prisma/migrations |
            tar -xf - -C "$RUNNER_TEMP/v04-pinned"
          mv prisma/migrations "$RUNNER_TEMP/v04-current-migrations"
          mkdir -p prisma/migrations
          cp -R "$RUNNER_TEMP/v04-pinned/prisma/migrations/." prisma/migrations/
          test "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "8"
          test ! -e prisma/migrations/20261108130000_d8_role_definition_governance
      - name: Deploy and verify exact eight-migration baseline
        run: |
          set -euo pipefail
          pnpm db:migrate:deploy
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(
              'SELECT "migration_name", "rolled_back_at" FROM public."_prisma_migrations" ORDER BY "started_at"',
            );
            assert.equal(rows.length, 8);
            assert.ok(rows.every((row) => row.rolled_back_at === null));
            assert.equal(rows[7].migration_name, "20261107130000_d7_typed_role_assignments");
          } finally {
            await client.end();
          }
          NODE
      - name: Execute D14-A on migrations 1–8
        run: pnpm test:d7
      - name: Apply migration 9 as a staged upgrade
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/v04-current-migrations/20261108130000_d8_role_definition_governance" prisma/migrations/
          pnpm db:migrate:deploy
          pnpm db:status
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(
              'SELECT "migration_name", "rolled_back_at" FROM public."_prisma_migrations" ORDER BY "started_at"',
            );
            assert.equal(rows.length, 9);
            assert.ok(rows.every((row) => row.rolled_back_at === null));
            assert.equal(rows[8].migration_name, "20261108130000_d8_role_definition_governance");
          } finally {
            await client.end();
          }
          NODE
      - name: Apply migration 10 to the staged D7 upgrade
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/v04-current-migrations/20261109120000_v04_permission_persistence" prisma/migrations/
          pnpm db:migrate:deploy
          pnpm db:status
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(
              'SELECT "migration_name", "rolled_back_at" FROM public."_prisma_migrations" ORDER BY "started_at"',
            );
            assert.equal(rows.length, 10);
            assert.ok(rows.every((row) => row.rolled_back_at === null));
            assert.equal(rows[9].migration_name, "20261109120000_v04_permission_persistence");
          } finally {
            await client.end();
          }
          NODE
      - name: Apply migration 11 tenant RLS
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/v04-current-migrations/20261109130000_v04_tenant_rls" prisma/migrations/
          pnpm db:migrate:deploy
          pnpm db:status
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(
              'SELECT "migration_name", "rolled_back_at" FROM public."_prisma_migrations" ORDER BY "started_at"',
            );
            assert.equal(rows.length, 11);
            assert.ok(rows.every((row) => row.rolled_back_at === null));
            assert.equal(rows[10].migration_name, "20261109130000_v04_tenant_rls");
          } finally {
            await client.end();
          }
          NODE
      - name: Apply migration 12 permission delegation metadata
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/v04-current-migrations/20261109140000_v04_permission_delegation" prisma/migrations/
          pnpm db:migrate:deploy
          pnpm db:status
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(
              'SELECT "migration_name", "rolled_back_at" FROM public."_prisma_migrations" ORDER BY "started_at"',
            );
            assert.equal(rows.length, 12);
            assert.ok(rows.every((row) => row.rolled_back_at === null));
            assert.equal(rows[11].migration_name, "20261109140000_v04_permission_delegation");
          } finally {
            await client.end();
          }
          NODE
      - name: Create isolated D8 fresh database
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const adminUrl = new URL(process.env.DATABASE_URL);
          adminUrl.pathname = "/postgres";
          adminUrl.search = "";
          const client = new pg.Client({ connectionString: adminUrl.toString() });
          await client.connect();
          try {
            await client.query('CREATE DATABASE "sap_core_d8_test"');
          } finally {
            await client.end();
          }
          NODE
      - name: Deploy all twelve migrations and execute D14-B
        env:
          CI_DATABASE_PORT: "55434"
          CI_DATABASE_NAME: sap_core_d8_test
        run: |
          export DATABASE_URL="postgresql://${CI_DATABASE_USER}@${CI_DATABASE_HOST}:${CI_DATABASE_PORT}/${CI_DATABASE_NAME}?schema=public"
          pnpm db:migrate:deploy
          pnpm db:status
          pnpm test:d8

